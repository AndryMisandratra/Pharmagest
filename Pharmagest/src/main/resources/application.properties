# Identite de l'application
spring.application.name=pharmagest

# Port sur lequel l'API ecoute (http://localhost:8080)
server.port=8080


#Connexion a postgesSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/pharmagest

# Utilisateur et mot de passe crees dans pgAdmin
spring.datasource.username=pharmagest_user
spring.datasource.password=pharmagest_pass

# Pilote JDBC PostgreSQL (correspond a la dependance dans pom.xml)
spring.datasource.driver-class-name=org.postgresql.Driver


# ============================================================
#JPA / HIBERNATE (ORM)
# ============================================================
# validate = Hibernate verifie que les entites Java correspondent
# aux tables SQL, mais NE cree PAS les tables lui-meme
# C'est Flyway qui cree les tables - on garde validate
spring.jpa.hibernate.ddl-auto=none

# false = ne pas afficher chaque requete SQL dans les logs (plus lisible)
spring.jpa.show-sql=false

# Dialecte PostgreSQL : dit a Hibernate quelle syntaxe SQL utiliser
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Evite les problemes de session JPA dans les controllers REST
spring.jpa.open-in-view=false


# ============================================================
# FLYWAY (migrations SQL automatiques)
# ============================================================
spring.flyway.enabled=false

# ============================================================
# JPA/HIBERNATE (création automatique des tables)
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ============================================================
#JWT (authentification)
# ============================================================
# Cle secrete pour signer les tokens (CHANGE en production !)
# Doit faire minimum 512 bits (64 caracteres base64)
app.jwt.secret=UGhhcm1hR2VzdFNlY3JldEtleVBvdXJKV1QyMDI1UGhhcm1hR2VzdFNlY3JldEtleVBvdXJKV1QyMDI1

# Duree de validite du token : 86400000 ms = 24 heures
app.jwt.expiration-ms=86400000


