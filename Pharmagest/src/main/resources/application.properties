# ============================================================
#SWAGGER (documentation API interactive)
# ============================================================
# URL pour acceder a la doc : http://localhost:8080/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true


# ============================================================
#ACTUATOR (surveillance de l'application)
# ============================================================
# Expose uniquement les endpoints health et info (securite)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized


# ============================================================
#UPLOAD FICHIERS (scans d'ordonnances)
# ============================================================
# Taille max d'un fichier uploade (scan PDF/image ordonnance)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Dossier de stockage des scans (relatif a la racine du projet)
app.upload.dir=uploads/ordonnances
