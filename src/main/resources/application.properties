# Identité de l'application
spring.application.name=pharmagest

# Port sur lequel l'API écoute (http://localhost:8080)
server.port=8080



#Connexion à postgesSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/pharmagest

# Utilisateur et mot de passe créés dans pgAdmin
spring.datasource.username=pharmagest_user
spring.datasource.password=pharmagest_pass

# Pilote JDBC PostgreSQL (correspond à la dépendance dans pom.xml)
spring.datasource.driver-class-name=org.postgresql.Driver


# ============================================================
#JPA / HIBERNATE (ORM)
# ============================================================
# validate = Hibernate vérifie que les entités Java correspondent
# aux tables SQL, mais NE crée PAS les tables lui-même
# C'est Flyway qui crée les tables ? on garde validate
spring.jpa.hibernate.ddl-auto=none

# false = ne pas afficher chaque requête SQL dans les logs (plus lisible)
spring.jpa.show-sql=false

# Dialecte PostgreSQL : dit à Hibernate quelle syntaxe SQL utiliser
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Évite les problèmes de session JPA dans les controllers REST
spring.jpa.open-in-view=false


# ============================================================
# FLYWAY (migrations SQL automatiques)
# ============================================================
# Forcer Flyway à s'exécuter
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false

# ============================================================
#JWT (authentification)
# ============================================================
# Clé secrète pour signer les tokens (CHANGE en production !)
# Doit faire minimum 512 bits (64 caractères base64)
app.jwt.secret=UGhhcm1hR2VzdFNlY3JldEtleVBvdXJKV1QyMDI1UGhhcm1hR2VzdFNlY3JldEtleVBvdXJKV1QyMDI1

# Durée de validité du token : 86400000 ms = 24 heures
app.jwt.expiration-ms=86400000


# ============================================================
#MAIL (alertes automatiques)
# ============================================================
# Pour l'instant on met des valeurs fictives
# On configurera vraiment lors du module Alertes (Semaine 2)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=pharmagest1228@gmail.com
spring.mail.password=vnrfsihawkxkjfml
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Email du pharmacien qui reçoit les alertes
app.alert.email=aandrymisa@gmail.com


# ============================================================
#SWAGGER (documentation API interactive)
# ============================================================
# URL pour accéder à la doc : http://localhost:8080/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true


# ============================================================
#ACTUATOR (surveillance de l'application)
# ============================================================
# Expose uniquement les endpoints health et info (sécurité)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized


# ============================================================
#UPLOAD FICHIERS (scans d'ordonnances)
# ============================================================
# Taille max d'un fichier uploadé (scan PDF/image ordonnance)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Dossier de stockage des scans (relatif à la racine du projet)
app.upload.dir=uploads/ordonnances

